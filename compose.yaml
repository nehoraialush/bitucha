services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bitucha
      POSTGRES_DB: bitucha
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitucha -d bitucha"]
      interval: 3s
      timeout: 3s
      retries: 30
  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://bitucha:${DB_PASSWORD}@db:5432/bitucha
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      WEB_ORIGIN: ${DOCKER_WEB_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: "false"
      CHROMIUM_NO_SANDBOX: "true"
    command:
      [
        "sh",
        "-c",
        "npm run db:migrate && npm run db:seed && exec ./node_modules/.bin/tsx apps/api/src/main.ts",
      ]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
